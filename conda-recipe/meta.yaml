{% set name = "cinderplot" %}
{% set version = "0.25.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # In-repo recipe: build the checked-out tree. CI builds the pushed
  # commit; a release build = check out the vX.Y.Z tag, then conda build.
  path: ..

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    # Target an OLD glibc. Without this the CI runner's compiler links against
    # whatever glibc ubuntu-latest ships (2.39 as of this writing), and the
    # resulting package will not start on a cluster -- the lab HPC is RHEL 9
    # with glibc 2.34, and 0.7.x died there with "GLIBC_2.38 not found" while
    # the identical source built locally needed only 2.34. 2.17 is the
    # conda-forge baseline and covers everything from CentOS 7 up.
    - sysroot_linux-64 2.17  # [linux]
    - make
    - pkg-config
  host:
    - cairo
    - zlib
  run:
    # cairo's / zlib's run_exports pin the runtime automatically; listed for clarity
    - cairo
    - zlib

test:
  commands:
    - cinderplot --version
    - cinderplot --help

about:
  home: https://github.com/zhou-lab/cinderplot
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast C plotter for ggplot2-quality figures, heatmaps, genome tracks, trees and chord diagrams
  description: |
    Cinderplot is a small, fast, grammar-inspired plotting tool written in C.
    It turns a CSV/TSV (plain or gzipped) into publication-quality PDF, SVG or
    PNG graphics via Cairo. Five modes, chosen by the verbs used: a
    ggplot2-flavoured grammar (aes/geom_*, facets, scales, themes), a
    wheatmap-style matrix mode (composable heatmaps, annotations, Ward
    clustering, dendrograms, legends), a genome locus browser of stacked
    tracks (bedGraph/BED/BEDPE/BED12, tabix), a Newick tree mode, and a
    circlize-style chord diagram. Dependencies are deliberately minimal:
    Cairo and zlib.
  dev_url: https://github.com/zhou-lab/cinderplot

extra:
  recipe-maintainers:
    - zwdzwd
